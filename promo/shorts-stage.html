<!doctype html>
<html><head><meta charset="utf-8">
<style>

* { box-sizing: border-box; margin: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #fdf7fc; }
body { font-family: Inter, sans-serif; color: #2a1238; }
#bg { position: absolute; inset: -10%; }
.blob { position: absolute; border-radius: 50%; filter: blur(90px); mix-blend-mode: multiply; }
#b1 { width: 820px; height: 820px; left: -200px; top: 60px; }
#b2 { width: 760px; height: 760px; right: -220px; top: 900px; }
#b3 { width: 560px; height: 560px; left: 300px; top: 1400px; }
.spark { position: absolute; border-radius: 50%; background: #ff9ec4; box-shadow: 0 0 12px 3px rgba(224,69,123,.35); }
.grad { background: linear-gradient(90deg, #ff7a45, #e0457b 50%, #8a3fd0); -webkit-background-clip: text; background-clip: text; color: transparent; }
.head { position: absolute; z-index: 20; left: 60px; right: 60px; top: 250px; text-align: center; font-weight: 850; letter-spacing: -0.025em; line-height: 1.08; font-size: 80px; display: none; }
.head > div { opacity: 0; }
.el { position: absolute; display: none; }
/* the phone */
#phone { left: 335px; top: 740px; width: 410px; height: 720px; border-radius: 64px; background: #2a1238; padding: 16px; z-index: 5;
  box-shadow: 0 40px 90px rgba(90,40,120,.3); transform-origin: 50% 0; }
#screen { position: absolute; inset: 16px; border-radius: 50px; overflow: hidden; background: linear-gradient(170deg, #fff, #f6ecfd); }

#feed { position: absolute; left: 22px; right: 22px; top: 80px; }
.post { margin-bottom: 18px; border-radius: 20px; background: #fff; box-shadow: 0 6px 18px rgba(90,40,120,.12); overflow: hidden; }

  background: linear-gradient(180deg, rgba(224,69,123,0), rgba(224,69,123,.35) 50%, rgba(224,69,123,0)); }
#igIcon { position: absolute; left: 50%; top: 50%; width: 200px; height: 200px; margin: -100px 0 0 -100px; border-radius: 52px;
  background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fd5949 45%, #d6249f 60%, #285AEB 90%); box-shadow: 0 20px 50px rgba(214,36,159,.35); }
#igIcon::before { content: ''; position: absolute; inset: 44px; border: 12px solid #fff; border-radius: 40px; }
#igIcon::after { content: ''; position: absolute; left: 76px; top: 76px; width: 48px; height: 48px; border: 12px solid #fff; border-radius: 50%; box-sizing: border-box; }
/* chips: what the data shows */
.chip { z-index: 9; padding: 18px 30px; border-radius: 999px; background: #fff; border: 3px solid #ead9f6; font-size: 40px; font-weight: 850;
  white-space: nowrap; color: #4a2366; box-shadow: 0 16px 40px rgba(90,40,120,.18); }
/* the card */
#card { z-index: 12; left: 190px; top: 540px; width: 700px; border-radius: 30px; box-shadow: 0 40px 100px rgba(90,40,120,.3); transform-origin: 50% 0; }
#hl { z-index: 13; border: 7px solid #ff8a3d; border-radius: 22px; box-shadow: 0 0 34px rgba(255,138,61,.55); }
#hl span { position: absolute; left: 50%; top: -16px; transform: translate(-50%, -100%); padding: 10px 26px; border-radius: 999px;
  background: #ff8a3d; color: #fff; font-size: 36px; font-weight: 900; white-space: nowrap; }
/* the MBTI reel's three test results */
.result { z-index: 8; width: 280px; padding: 30px 26px; border-radius: 28px; background: #fff; text-align: center; box-shadow: 0 24px 60px rgba(90,40,120,.2); }
.result small { display: block; font-size: 26px; font-weight: 700; color: #8a7a99; }
.result b { display: block; margin-top: 10px; font-size: 76px; font-weight: 900; letter-spacing: .02em; color: #4a2366; }
#huh { z-index: 10; left: 0; right: 0; top: 1130px; text-align: center; font-size: 140px; font-weight: 900; color: #e0457b; }
/* the call to action */
#cta { z-index: 20; left: 50px; right: 50px; top: 1180px; text-align: center; font-weight: 900; letter-spacing: -0.03em; line-height: 1.04; font-size: 104px; }
#cta small { display: block; margin-top: 18px; font-size: 46px; font-weight: 800; letter-spacing: -0.01em; color: #6b3f8f; }
#site { z-index: 20; left: 50%; top: 1560px; padding: 22px 52px; border-radius: 999px; font-size: 46px; font-weight: 900; color: #fff; white-space: nowrap;
  background: linear-gradient(90deg, #ff7eb3, #c792ff); box-shadow: 0 20px 60px rgba(255,126,179,.5); }
#types { z-index: 19; left: 0; right: 0; top: 1440px; height: 90px; overflow: hidden; }
#types div { position: absolute; top: 0; padding: 14px 28px; border-radius: 999px; background: #fff; border: 3px solid #ead9f6; font-size: 40px; font-weight: 900; color: #7b3fa0; }
/* The coach reel: the questions on a dusk ground, then the answer on the phone as the ground warms. */
#dusk { position: absolute; inset: 0; z-index: 1; background: radial-gradient(120% 80% at 50% 30%, #4a2366 0%, #2a1238 55%, #160a22 100%); display: none; }
#hook { z-index: 20; left: 90px; right: 90px; top: 820px; text-align: center; color: #fff; font-size: 74px; font-weight: 800; line-height: 1.15; letter-spacing: -0.02em; }
#hook i { font-style: normal; opacity: 0; }
.q { z-index: 20; left: 80px; right: 80px; top: 780px; text-align: center; color: #fff; font-size: 92px; font-weight: 800; line-height: 1.1; letter-spacing: -0.025em;
  text-shadow: 0 10px 40px rgba(0,0,0,.35); }
#chat { position: absolute; left: 18px; right: 18px; top: 84px; display: none; }
#chat h6 { margin: 0 0 14px; text-align: center; font-size: 20px; font-weight: 800; color: #8a3fd0; letter-spacing: .04em; }
.bq { margin-left: auto; width: max-content; max-width: 86%; padding: 12px 16px; border-radius: 20px 20px 6px 20px; color: #fff; font-size: 22px; font-weight: 700;
  background: linear-gradient(90deg, #8a3fd0, #e0457b); }
.ba { margin-top: 14px; max-width: 100%; padding: 16px 18px; border-radius: 20px 20px 20px 6px; background: #fff; color: #2a1238; font-size: 23px; line-height: 1.42;
  font-weight: 550; box-shadow: 0 8px 20px rgba(90,40,120,.14); }
.ba b { color: #c2407a; }
</style></head>
<body>
  <div id="bg"><div class="blob" id="b1"></div><div class="blob" id="b2"></div><div class="blob" id="b3"></div></div>
  <div id="sparks"></div>
  <div id="dusk"></div>
  <div id="heads"></div>
  <div class="el" id="hook"></div>
  <div id="qs"></div>
  <div class="el" id="phone"><div id="screen"><div id="notch"></div><div id="feed"></div><div id="chat"><h6>ASK PSYCHEAI</h6><div class="bq">What’s my most underrated trait?</div><div class="ba" id="answer"></div></div><div id="scan"></div><div id="igIcon"></div></div></div>
  <div id="chips"></div>
  <div id="results"></div>
  <div class="el" id="huh">?</div>
  <img class="el" id="card">
  <div class="el" id="hl"><span></span></div>
  <div class="el" id="cta"></div>
  <div class="el" id="types"></div>
  <div class="el" id="site">psycheai.io ↗</div>
<script>
const TL = __TIMELINE__;
const PARTS = __PARTS__;
const S = TL.scenes, BEAT = 60 / TL.bpm, REEL = TL.reel;
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const ease = x => 1 - Math.pow(1 - x, 3);
const easeIO = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const back = x => { const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const PAL = [['#f3dcff', '#ffd6e7'], ['#e6dcff', '#ffdbe6'], ['#f6d9f6', '#ffe0cc'], ['#ffd9ec', '#ffe2c7'], ['#f3d6ff', '#ffd9e8'], ['#e6dcff', '#ffdbe6'], ['#ffd9ec', '#ffe2c7']];
const mixHex = (a, b, k) => { const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)); const A = p(a), B = p(b);
  return 'rgb(' + A.map((v, i) => Math.round(v + (B[i] - v) * k)).join(',') + ')'; };
const show = (id, o, tf) => { const el = typeof id === 'string' ? $(id) : id; el.style.opacity = o; el.style.display = o > 0.001 ? 'block' : 'none';
  if (tf !== undefined) el.style.transform = tf; };
const said = (i, word, fallback) => ((S[i].words || []).find(([w]) => w === word) || [0, fallback])[1];
const sparks = Array.from({ length: 22 }, (_, i) => { const s = document.createElement('div'); s.className = 'spark'; $('sparks').appendChild(s);
  return { el: s, x: (i * 397) % 1080, speed: 60 + (i * 53) % 90, phase: (i * 0.37) % 1, size: 4 + (i * 7) % 9 }; });

// Each reel: its headlines (one a scene, a line or two of them, the second shown at the scene's second mark),
// its chips, and which card it reveals.
const REELS = {
  notes: {
    card: 'assets/card.png',
    heads: [
      ['Your Instagram has been <span class="grad">taking notes</span> on you for years.'],
      ['It knows you…'],
      ['So I let <span class="grad">PsycheAI</span> read it.'],
      ['I got <span class="grad">Mulan</span>', '<span style="font-size:52px;color:#6b3f8f">The organiser with a warm centre</span>'],
      [],
    ],
    chips: [['🗓️ Organises every plan', 70, 760], ['🤍 Gives more than you ask for', 250, 1050], ['🔋 Goes quiet to recharge', 150, 1340]],
    cta: 'Comment <span class="grad">“CARD”</span><small>and I’ll send you the link</small>',
  },
  mbti: {
    card: 'assets/card-odysseus.png',
    heads: [
      ['I took the <span class="grad">MBTI test</span><br>3 times…', '<span style="font-size:56px;color:#6b3f8f">…and got 3 different answers</span>'],
      ['So I loaded my <span class="grad">Instagram data</span> instead'],
      ['No questions asked.', 'Just what my <span class="grad">online patterns</span> actually show'],
      ['I got <span class="grad">Odysseus</span>', '<span style="font-size:56px;color:#6b3f8f">ENTP, with the evidence</span>'],
      [],
    ],
    // Odysseus's own signature patterns (A plan B for every plan, Talks a room round, Always heading home), as his card's evidence puts them.
    chips: [['🧭 Rescues every plan with a plan B', 50, 760], ['🗣️ Talks every group round', 330, 1050], ['🏠 Same few friends hear it all first', 70, 1340]],
    cta: 'What’s <span class="grad">yours?</span><small>Comment your type 👇</small>',
  },
  coach: {
    card: 'assets/card.png',
    heads: [[], [], [], [],
      ['<span style="font-size:60px"><span class="grad">PsycheAI</span> answers from what your own data shows</span>'],
      ['A coach that <span class="grad">already knows you</span>', '<span style="font-size:48px;color:#6b3f8f">Your first question is free</span>'],
      []],
    chips: [],
    cta: 'Ask <span class="grad">yours</span>',
    hook: 'Questions you’ve never asked out loud.',
    questions: ['What’s my most underrated trait?', 'What do people misunderstand about me?', 'What would I regret most, when I’m old?'],
    // From the Mulan sample's own report: 47 posts naming a deadline, 41 closing it out, the win written as
    // ours, and no post in four years saying the load was heavy.
    answer: '<b>Your quiet strength.</b> In four years you posted 47 plans and closed out 41, and wrote each win as ‘ours’. ' +
      'Not one post says the load was heavy. You carry more than anyone sees.',
  },
}[REEL];
$('card').src = REELS.card;
$('cta').innerHTML = REELS.cta;
const heads = REELS.heads.map((lines, i) => { const h = document.createElement('div'); h.className = 'head';
  if (REEL === 'mbti' && i === 0) h.style.fontSize = '74px';
  if (REEL === 'mbti' && i === 2) h.style.fontSize = '68px';
  h.innerHTML = lines.map(l => '<div>' + l + '</div>').join(''); $('heads').appendChild(h); return h; });
const chips = REELS.chips.map(([text, x, y]) => { const c = document.createElement('div'); c.className = 'chip el'; c.textContent = text;
  c.style.left = x + 'px'; c.style.top = y + 'px'; $('chips').appendChild(c); return c; });
for (let k = 0; k < 3; k++) { const p = document.createElement('div'); p.className = 'post';
  p.innerHTML = '<div class="top"><div class="av"></div><div class="nm"></div></div><div class="ph" style="background:' +
    ['linear-gradient(135deg,#ffd6a5,#ff9ec4)', 'linear-gradient(135deg,#c7b8ff,#ffc2e2)', 'linear-gradient(135deg,#b8f0d8,#c7d2ff)'][k] + '"></div>';
  $('feed').appendChild(p); }
const RESULTS = [['Test 1', 'INFJ', 50, 760, -7], ['Test 2', 'ESTP', 400, 880, 4], ['Test 3', 'INTP', 750, 760, 6]];
const results = RESULTS.map(([n, type, x, y]) => { const d = document.createElement('div'); d.className = 'result el';
  d.innerHTML = '<small>' + n + '</small><b>' + type + '</b>'; d.style.left = x + 'px'; d.style.top = y + 'px'; $('results').appendChild(d); return d; });
const TYPES = ['INFJ', 'ENFP', 'ISTJ', 'ENTP', 'INTP', 'ESFJ', 'ISFP', 'ENTJ', 'INFP', 'ESTP', 'ISFJ', 'ENFJ'];
TYPES.concat(TYPES).forEach(t => { const d = document.createElement('div'); d.textContent = t; $('types').appendChild(d); });

function head(i, t) {
  const s = S[i], h = heads[i], parts = [...h.children];
  const out = 1 - prog(t, s.end - 0.12, s.end + 0.08);
  h.style.display = parts.length && t > s.start - 0.2 && t < s.end + 0.1 ? 'block' : 'none';
  parts.forEach((el, k) => { const at = k ? (s.marks[1] !== undefined ? s.marks[1] : s.vo + 1) - 0.2 : s.vo - 0.25, p = prog(t, at, at + 0.35);
    el.style.opacity = clamp(p * 2) * out; el.style.transform = 'translateY(' + (1 - ease(p)) * 40 + 'px) scale(' + (0.7 + 0.3 * back(p)) + ')'; });
}

function render(t) {
  const si = S.findIndex(s => t < s.end), cur = si < 0 ? S.length - 1 : si, nxt = Math.min(S.length - 1, cur + 1);
  const k = prog(t, S[cur].end - 0.5, S[cur].end + 0.3);
  const c1 = mixHex(PAL[cur][0], PAL[nxt][0], k), c2 = mixHex(PAL[cur][1], PAL[nxt][1], k);
  const REVEAL = S[3], CTA = S[4];
  const ph = (t % BEAT) / BEAT, pulse = t >= S[1].start ? Math.exp(-ph * 6) * (t >= REVEAL.start ? 1 : 0.4) : 0;
  document.body.style.background = 'radial-gradient(130% 90% at 50% 0%, ' + c1 + ' 0%, #fdf7fc 60%, #f7effd 100%)';
  $('b1').style.background = c2; $('b2').style.background = c1; $('b3').style.background = '#ffd2b0';
  $('b1').style.opacity = 0.5 + pulse * 0.3; $('b2').style.opacity = 0.45 + pulse * 0.3; $('b3').style.opacity = 0.18 + pulse * 0.2;
  $('b1').style.transform = 'translate(' + Math.sin(t * .6) * 140 + 'px,' + Math.cos(t * .45) * 180 + 'px) scale(' + (1 + pulse * 0.12) + ')';
  $('b2').style.transform = 'translate(' + Math.cos(t * .5) * 160 + 'px,' + Math.sin(t * .4) * 200 + 'px) scale(' + (1 + pulse * 0.12) + ')';
  $('b3').style.transform = 'translate(' + Math.sin(t * .7) * 220 + 'px,' + Math.cos(t * .6) * 120 + 'px)';
  sparks.forEach(p => { p.el.style.left = (p.x + Math.sin(t + p.phase * 6) * 30) + 'px'; p.el.style.top = (1980 - ((t * p.speed + p.phase * 2000) % 2080)) + 'px';
    p.el.style.width = p.el.style.height = p.size + 'px'; p.el.style.opacity = 0.5 * (0.6 + pulse * 0.4); });
  S.forEach((s, i) => head(i, t));
  if (REEL === 'coach') return coach(t, pulse);

  // The card: flips in on the reveal (the hit), the type or character highlighted, then rises to make room for the ask.
  const flip = easeIO(prog(t, REVEAL.start - 0.05, REVEAL.start + 0.5)), rise = easeIO(prog(t, CTA.start - 0.1, CTA.start + 0.5));
  const cardScale = (1 - 0.38 * rise) * (1 + pulse * 0.012);
  show('card', clamp(flip * 3), 'translateY(' + (-260 * rise) + 'px) perspective(1600px) rotateY(' + (1 - flip) * 80 + 'deg) scale(' + cardScale + ')');
  // The MBTI reel rings the card's type as the voice says it.
  if (REEL === 'mbti') {
    const p = PARTS.type, W = 700, H = W * PARTS.aspect, at = said(3, 'e', REVEAL.vo + 1.4) - 0.1;
    const box = $('hl'); box.querySelector('span').textContent = 'ENTP';
    Object.assign(box.style, { left: (190 + p.x * W - 8) + 'px', top: (540 + p.y * H - 8) + 'px', width: (p.w * W + 16) + 'px', height: (p.h * H + 16) + 'px' });
    const ring = back(prog(t, at, at + 0.35));
    show(box, clamp(ring * 2) * (1 - prog(t, CTA.start - 0.2, CTA.start)), 'scale(' + Math.min(1.05, ring) + ')');
  }
  // The ask: the line, then the address.
  // Once the card has risen out of its way.
  const ctaAt = Math.max(CTA.vo - 0.25, CTA.start + 0.45), cta = back(prog(t, ctaAt, ctaAt + 0.4));
  show('cta', clamp(cta * 2), 'translateY(' + (1 - Math.min(1, cta)) * 50 + 'px) scale(' + (0.75 + 0.25 * cta) + ')');
  const site = back(prog(t, CTA.voEnd - 0.1, CTA.voEnd + 0.3));
  show('site', clamp(site * 2), 'translateX(-50%) scale(' + (Math.min(1.05, site) + pulse * 0.05 * Math.min(1, site)) + ')');

  if (REEL === 'notes') {
    // The phone, its feed scrolling, through the hook, the habits and the reading; gone as the card lands.
    const phIn = back(prog(t, 0.05, 0.45)), phOut = prog(t, REVEAL.start - 0.1, REVEAL.start + 0.2);
    show('phone', clamp(phIn * 2) * (1 - phOut), 'translateY(' + (1 - Math.min(1, phIn)) * 200 + 'px) scale(' + 1.2 * (1 - 0.3 * phOut) + ')');
    $('feed').style.transform = 'translateY(' + (-((t * 70) % 270)) + 'px)';
    $('igIcon').style.display = 'none';
    // The habits, one per phrase, as the voice says each; drawn into the phone as AI reads it.
    const read = easeIO(prog(t, S[2].vo + 0.1, S[2].vo + 0.9));
    chips.forEach((c, i) => { const at = S[1].marks[i] - 0.15, p = back(prog(t, at, at + 0.35));
      const [, x, y] = REELS.chips[i], cx = 540 - c.offsetWidth / 2, cy = 1100;
      c.style.left = (x + (cx - x) * read) + 'px'; c.style.top = (y + (cy - y) * read) + 'px';
      show(c, clamp(p * 2) * (1 - prog(read, 0.7, 1)), 'scale(' + Math.min(1.05, p) * (1 - 0.6 * read) + ') rotate(' + (i % 2 ? 3 : -3) * (1 - read) + 'deg)'); });
    const scanOn = prog(t, S[2].start, S[2].start + 0.2) * (1 - prog(t, REVEAL.start - 0.2, REVEAL.start));
    $('scan').style.opacity = scanOn; $('scan').style.top = (((t - S[2].start) * 900) % 820 - 120) + 'px';
  } else {
    // The three test results: one a beat on "three times", shaken on "different answers", gone as Instagram comes in.
    const shake = prog(t, S[0].marks[1] + 0.3, S[0].marks[1] + 1.1), gone = easeIO(prog(t, S[1].start - 0.15, S[1].start + 0.35));
    results.forEach((r, i) => { const at = S[0].vo + 0.55 + i * 0.4, p = back(prog(t, at, at + 0.35)), [, , x, y, tilt] = RESULTS[i];
      const wob = Math.sin(shake * Math.PI * 6 + i) * 10 * Math.sin(shake * Math.PI);
      show(r, clamp(p * 2) * (1 - gone), 'translate(' + (x < 300 ? -1 : x > 500 ? 1 : 0) * gone * 500 + 'px,' + gone * -200 + 'px) rotate(' + (tilt + wob) + 'deg) scale(' + Math.min(1.05, p) + ')'); });
    const huh = back(prog(t, S[0].marks[1] + 0.35, S[0].marks[1] + 0.7));
    show('huh', clamp(huh * 2) * (1 - gone), 'scale(' + Math.min(1.1, huh) + ') rotate(' + Math.sin(t * 6) * 6 + 'deg)');
    // Instagram, on the phone, for the asking and the habits; gone as the card lands.
    const phIn = back(prog(t, S[1].start, S[1].start + 0.4)), phOut = prog(t, REVEAL.start - 0.1, REVEAL.start + 0.2);
    show('phone', clamp(phIn * 2) * (1 - phOut), 'translateY(' + (1 - Math.min(1, phIn)) * 200 + 'px) scale(' + 1.2 * (1 - 0.3 * phOut) + ')');
    $('feed').style.display = 'none'; $('scan').style.opacity = 0;
    $('igIcon').style.transform = 'scale(' + (back(prog(t, S[1].vo + 0.8, S[1].vo + 1.2)) + pulse * 0.04) + ')';
    chips.forEach((c, i) => { const at = S[2].marks[1] + 0.2 + i * 0.35, p = back(prog(t, at, at + 0.35)), out = prog(t, REVEAL.start - 0.15, REVEAL.start + 0.1);
      show(c, clamp(p * 2) * (1 - out), 'scale(' + Math.min(1.05, p) + ') rotate(' + (i % 2 ? 3 : -3) + 'deg)'); });
    // The types, scrolling under the ask.
    const typesIn = prog(t, CTA.vo + 0.6, CTA.vo + 1.0);
    show('types', typesIn);
    [...$('types').children].forEach((d, i) => { d.style.left = (i * 210 - ((t * 120) % (TYPES.length * 210))) + 'px'; });
  }
}
// The coach reel: the hook typed out and the three questions, one at a time, on the dusk ground; then the
// ground warms, and the phone shows the first question answered, typed in; then the ask.
const hookChars = REEL === 'coach' ? [...REELS.hook].map(ch => { const i = document.createElement('i'); i.textContent = ch; $('hook').appendChild(i); return i; }) : [];
const qEls = REEL === 'coach' ? REELS.questions.map(q => { const d = document.createElement('div'); d.className = 'q el'; d.textContent = q; $('qs').appendChild(d); return d; }) : [];
const answerWords = REEL === 'coach' ? REELS.answer.split(/(?<=\s)/) : [];

  show('hook', 1 - hookOut);
  hookChars.forEach((c, i) => { c.style.opacity = prog(t, S[0].vo + i * 0.045, S[0].vo + i * 0.045 + 0.12); });
  // Each question alone: drifts up out of a blur as it is said, held, then gone.
  qEls.forEach((q, i) => { const s = S[i + 1], inn = ease(prog(t, s.vo - 0.35, s.vo + 0.35)), out = prog(t, s.end - 0.45, s.end - 0.05);
    show(q, inn * (1 - out), 'translateY(' + ((1 - inn) * 40 - out * 30) + 'px)'); q.style.filter = 'blur(' + ((1 - inn) * 8 + out * 6) + 'px)'; });
  // The phone with the answer, through the answer and the promise.
  const phIn = back(prog(t, A.start + 0.1, A.start + 0.5)), phOut = prog(t, CTA.start - 0.1, CTA.start + 0.25);
  show('phone', clamp(phIn * 2) * (1 - phOut), 'translateY(' + ((1 - Math.min(1, phIn)) * 200 - 150) + 'px) scale(' + 1.5 * (1 - 0.2 * phOut) + ')');
  $('feed').style.display = 'none'; $('scan').style.opacity = 0; $('igIcon').style.display = 'none';
  $('chat').style.display = 'block';
  const asked = back(prog(t, A.start + 0.45, A.start + 0.8));
  $('chat').querySelector('.bq').style.opacity = clamp(asked * 2); $('chat').querySelector('.bq').style.transform = 'scale(' + Math.min(1, asked) + ')';
  const typed = Math.round(answerWords.length * prog(t, A.vo + 0.2, A.vo + 4.2));
  $('answer').innerHTML = answerWords.slice(0, typed).join('') || '…';
  $('answer').style.opacity = prog(t, A.start + 0.8, A.start + 1.0);
  // The ask.
  const cta = back(prog(t, CTA.vo - 0.2, CTA.vo + 0.2));
  $('cta').style.top = '820px';
  show('cta', clamp(cta * 2), 'translateY(' + (1 - Math.min(1, cta)) * 50 + 'px) scale(' + (0.75 + 0.25 * cta) + ')');
  const site = back(prog(t, CTA.vo + 0.9, CTA.vo + 1.3));
  $('site').style.top = '1060px';
  show('site', clamp(site * 2), 'translateX(-50%) scale(' + (Math.min(1.05, site) + pulse * 0.05 * Math.min(1, site)) + ')');
}
window.render = render;
window.ready = Promise.all([document.fonts.ready, ...[...document.images].map(i => i.decode())]);
