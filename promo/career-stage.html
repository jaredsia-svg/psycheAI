<!doctype html>
<html><head><meta charset="utf-8">
<style>
/* The career reel (shorts.py career): the job questions as searches, asked of PsycheAI, its answer typed in,
   then what the report's career assessment adds. */
@font-face { font-family: Inter; src: url('assets/inter.woff2') format('woff2'); font-weight: 100 900; }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #fdf7fc; }
body { font-family: Inter, sans-serif; color: #2a1238; }
.el { position: absolute; display: none; }
.grad { background: linear-gradient(90deg, #ff7a45, #e0457b 50%, #8a3fd0); -webkit-background-clip: text; background-clip: text; color: transparent; }
#dusk { position: absolute; inset: 0; background: radial-gradient(120% 80% at 50% 30%, #4a2366 0%, #2a1238 55%, #160a22 100%); }
.blob { position: absolute; border-radius: 50%; filter: blur(90px); }
#b1 { width: 820px; height: 820px; left: -200px; top: 60px; background: #ffd6e7; }
#b2 { width: 760px; height: 760px; right: -220px; top: 900px; background: #e6dcff; }
.mote { position: absolute; border-radius: 50%; background: #fff; }
/* The hook. */
#hook { z-index: 20; left: 70px; right: 70px; top: 800px; text-align: center; color: #fff; font-size: 104px; font-weight: 900; line-height: 1.05; letter-spacing: -0.035em; }
#hook i { font-style: normal; }
#hookIcon { z-index: 19; left: 0; right: 0; top: 560px; text-align: center; font-size: 170px; }
/* The questions, as searches. */
#said { z-index: 20; left: 60px; right: 60px; top: 300px; height: 120px; }
#said div { position: absolute; left: 0; right: 0; text-align: center; color: #fff; font-size: 100px; font-weight: 900; letter-spacing: -0.03em; }
#search { z-index: 20; left: 90px; width: 900px; top: 560px; }
#bar { height: 130px; border-radius: 65px; background: #fff; display: flex; align-items: center; gap: 26px; padding: 0 44px; font-size: 44px; font-weight: 650; color: #2a1238;
  box-shadow: 0 30px 80px rgba(0,0,0,.35); }
#bar .caret { display: inline-block; width: 4px; height: 52px; background: #8a3fd0; margin-left: 2px; vertical-align: middle; }
#recent { margin-top: 22px; border-radius: 44px; background: rgba(255,255,255,.96); padding: 18px 0; box-shadow: 0 30px 80px rgba(0,0,0,.3); }
#recent h6 { padding: 6px 44px 12px; font-size: 28px; font-weight: 800; color: #8a7a99; letter-spacing: .06em; text-transform: uppercase; }
.rs { display: flex; align-items: center; gap: 26px; padding: 22px 44px; font-size: 42px; font-weight: 650; color: #2a1238; line-height: 1.2; }
.rs span { flex: none; font-size: 40px; opacity: .6; }
/* Asking PsycheAI: the phone. */
.cap { z-index: 20; left: 60px; right: 60px; text-align: center; font-weight: 900; letter-spacing: -0.03em; line-height: 1.08; }
#ask1 { top: 200px; font-size: 84px; }
#ask2 { top: 300px; font-size: 56px; font-weight: 800; color: #6b3f8f; }
#phone { z-index: 10; left: 110px; top: 430px; width: 860px; height: 1300px; border-radius: 90px; background: #2a1238; padding: 20px;
  box-shadow: 0 50px 120px rgba(90,40,120,.35); }
#screen { position: absolute; inset: 20px; border-radius: 72px; overflow: hidden; background: linear-gradient(170deg, #fff, #f6ecfd); }
#notch { position: absolute; left: 50%; top: 34px; width: 180px; height: 44px; margin-left: -90px; border-radius: 22px; background: #2a1238; }
#chat { position: absolute; left: 40px; right: 40px; top: 110px; }
#chat h6 { margin: 0 0 26px; text-align: center; font-size: 30px; font-weight: 850; color: #8a3fd0; letter-spacing: .06em; }
.bq { margin-left: auto; width: max-content; max-width: 88%; padding: 22px 30px; border-radius: 36px 36px 10px 36px; color: #fff; font-size: 38px; font-weight: 700;
  line-height: 1.3; background: linear-gradient(90deg, #8a3fd0, #e0457b); }
#answer { margin-top: 26px; padding: 30px 34px; border-radius: 36px 36px 36px 10px; background: #fff; color: #2a1238; font-size: 39px; line-height: 1.42;
  font-weight: 550; box-shadow: 0 10px 30px rgba(90,40,120,.14); }
#answer b { color: #c2407a; font-weight: 850; }
#source { margin-top: 18px; font-size: 26px; font-weight: 700; color: #8a7a99; }
/* What the report adds. */
#more { z-index: 20; left: 60px; right: 60px; top: 260px; text-align: center; font-size: 82px; font-weight: 900; letter-spacing: -0.03em; line-height: 1.08; }
.rc { z-index: 15; left: 80px; width: 920px; padding: 38px 44px; border-radius: 44px; background: #fff; box-shadow: 0 30px 80px rgba(90,40,120,.2); }
.rc small { display: flex; align-items: center; gap: 16px; font-size: 30px; font-weight: 850; letter-spacing: .07em; color: #8a3fd0; text-transform: uppercase; }
.rc small span { font-size: 44px; }
.rc p { margin-top: 14px; font-size: 44px; font-weight: 800; line-height: 1.2; color: #2a1238; }
.cols { display: flex; gap: 26px; margin-top: 18px; }
.cols div { flex: 1; padding: 20px 24px; border-radius: 26px; font-size: 32px; font-weight: 700; line-height: 1.35; }
.cols b { display: block; font-size: 26px; letter-spacing: .05em; text-transform: uppercase; margin-bottom: 6px; }
.cols .yes { background: #eafaf1; color: #145a3a; }
.cols .no { background: #fdecef; color: #8a1f3d; }
/* The close. */
#close { z-index: 20; left: 40px; right: 40px; top: 720px; text-align: center; font-size: 100px; font-weight: 900; letter-spacing: -0.04em; line-height: 1.02; }
#site { z-index: 20; left: 50%; top: 1150px; padding: 28px 64px; border-radius: 999px; font-size: 54px; font-weight: 900; color: #fff; white-space: nowrap;
  background: linear-gradient(90deg, #ff7a45, #e0457b 55%, #8a3fd0); box-shadow: 0 20px 60px rgba(224,69,123,.4); }
#free { z-index: 20; left: 0; right: 0; top: 1330px; text-align: center; font-size: 44px; font-weight: 800; color: #6b3f8f; }
</style></head>
<body>
  <div class="blob" id="b1"></div><div class="blob" id="b2"></div>
  <div id="dusk"></div>
  <div id="motes"></div>
  <div class="el" id="hookIcon">💼</div>
  <div class="el" id="hook"></div>
  <div class="el" id="said"></div>
  <div class="el" id="search"><div id="bar"><span>🔍</span><span id="q"></span></div><div id="recent"><h6>Recent searches</h6></div></div>
  <div class="el cap" id="ask1">So I asked <span class="grad">PsycheAI</span>…</div>
  <div class="el cap" id="ask2">…and it answered from my own data</div>
  <div class="el" id="phone"><div id="screen"><div id="notch"></div><div id="chat"><h6>ASK PSYCHEAI</h6>
    <div class="bq">Am I in the wrong job, or am I the problem?</div><div id="answer"></div><div id="source"></div></div></div></div>
  <div class="el" id="more">Your <span class="grad">Psyche Report</span><br>goes further</div>
  <div id="cards"></div>
  <div class="el" id="close">A coach that<br><span class="grad">already knows you</span></div>
  <div class="el" id="site">psycheai.io ↗</div>
  <div class="el" id="free">Your first Psyche Card is free</div>
<script>
const TL = __TIMELINE__;
const S = TL.scenes, BEAT = 60 / TL.bpm;
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const ease = x => 1 - Math.pow(1 - x, 3);
const easeIO = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const back = x => { const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const show = (id, o, tf) => { const el = typeof id === 'string' ? $(id) : id; el.style.opacity = o; el.style.display = o > 0.001 ? 'block' : 'none';
  if (tf !== undefined) el.style.transform = tf; };
const mk = (cls, html, parent) => { const d = document.createElement('div'); d.className = cls; d.innerHTML = html; parent.appendChild(d); return d; };
const hash = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const [HOOK, QS, ASK, ANS, REP, CLOSE] = S;

// The hook, letter by letter.
const hookChars = [...'Struggling with your job?'].map(ch => { const i = document.createElement('i'); i.textContent = ch; $('hook').appendChild(i); return i; });
// The questions: said big, one after another, while the same doubts pile up as searches.
const SAID = ['Wrong job?', 'Slow days?', 'Am I the problem?'];
const said = SAID.map(tx => mk('', tx, $('said')));
const SEARCHES = ['am I in the wrong job', 'why does my workday go so slowly', 'am I the problem'];
const rows = SEARCHES.map(tx => mk('rs', '<span>🕘</span><div>' + tx + '</div>', $('recent')));
// The answer: a sample reader's, from the kinds of evidence the app reads; the first sentence is what the voice says.
const ANSWER = '<b>You don’t hate your job. You hate the routine parts of it.</b> Every time you’ve talked about quitting, ' +
  'it was the routine parts: reports, approvals, waiting on someone. But your longest, fastest messages are when you’re untangling ' +
  'a problem – a friend’s CV, a trip that fell apart, a launch that went sideways. <b>A new job won’t fix that. Go after the messy ' +
  'problems in the one you have.</b>';
const answerWords = ANSWER.split(/(?<=\s)/);
const fixTags = h => /<b>(?![\s\S]*<\/b>)/.test(h) ? h + '</b>' : h;
// What the report adds: its career assessment, part by part, as the voice names each.
const CARDS = [
  ['🎯', 'Your edge', '<p>Untangling messy problems faster than anyone around you</p>'],
  ['🧱', 'What’s holding you back', '<p>Waiting for permission to start what you already see</p>'],
  ['🧭', 'Careers that suit you', '<div class="cols"><div class="yes"><b>Suits you best</b>Product operations · Consulting · Early-stage teams</div>' +
    '<div class="no"><b>Likely to drain you</b>Compliance · Data entry</div></div>'],
];
const cards = CARDS.map(([ic, h, body], i) => { const d = mk('rc el', '<small><span>' + ic + '</span>' + h + '</small>' + body, $('cards'));
  d.style.top = (560 + i * 300) + 'px'; return d; });
const motes = Array.from({ length: 26 }, (_, i) => { const d = document.createElement('div'); d.className = 'mote'; $('motes').appendChild(d);
  return { el: d, x: hash(i) * 1080, speed: 30 + hash(i + 4) * 50, phase: hash(i + 8), size: 3 + hash(i + 2) * 6 }; });

function render(t) {
  const ph = (t % BEAT) / BEAT, pulse = t >= ANS.start ? Math.exp(-ph * 6) : 0;
  // Dusk for the questions; it warms as PsycheAI is asked.
  const warm = easeIO(prog(t, ASK.start - 0.3, ASK.start + 0.6));
  $('dusk').style.opacity = 1 - warm;
  document.body.style.background = 'radial-gradient(130% 90% at 50% 0%, #ffd6e7 0%, #fdf7fc 60%, #f3e6ff 100%)';
  $('b1').style.transform = 'translate(' + Math.sin(t * .6) * 140 + 'px,' + Math.cos(t * .45) * 180 + 'px) scale(' + (1 + pulse * 0.08) + ')';
  $('b2').style.transform = 'translate(' + Math.cos(t * .5) * 160 + 'px,' + Math.sin(t * .4) * 200 + 'px) scale(' + (1 + pulse * 0.08) + ')';
  motes.forEach(m => { m.el.style.left = (m.x + Math.sin(t + m.phase * 6) * 30) + 'px'; m.el.style.top = (1980 - ((t * m.speed + m.phase * 2000) % 2080)) + 'px';
    m.el.style.width = m.el.style.height = m.size + 'px'; m.el.style.opacity = 0.35 * (1 - warm); });

  // The hook.
  const hookOut = prog(t, HOOK.end - 0.25, HOOK.end);
  show('hook', 1 - hookOut);
  hookChars.forEach((c, i) => { c.style.opacity = prog(t, HOOK.vo + i * 0.03, HOOK.vo + i * 0.03 + 0.1); });
  const ic = back(prog(t, HOOK.vo, HOOK.vo + 0.4));
  show('hookIcon', clamp(ic * 2) * (1 - hookOut), 'scale(' + Math.min(1.05, ic) + ') rotate(' + (-8 + Math.sin(t * 2) * 4) + 'deg)');

  // The questions.
  const qOn = t >= QS.start - 0.05 && t < QS.end, qOut = prog(t, QS.end - 0.25, QS.end);
  show('said', qOn ? 1 - qOut : 0);
  said.forEach((d, i) => { const a = QS.marks[i] - 0.1, b = i < 2 ? QS.marks[i + 1] - 0.1 : QS.end, p = back(prog(t, a, a + 0.3));
    d.style.opacity = t >= a && t < b ? clamp(p * 2) * (1 - prog(t, b - 0.15, b)) : 0; d.style.transform = 'scale(' + (0.7 + 0.3 * Math.min(1, p)) + ')'; });
  const sIn = back(prog(t, QS.start, QS.start + 0.4));
  show('search', qOn ? clamp(sIn * 2) * (1 - qOut) : 0, 'translateY(' + (1 - Math.min(1, sIn)) * 120 + 'px)');
  // The bar types the newest search while the rows pile up above the older ones.
  const k = QS.marks.filter(m => t >= m - 0.1).length - 1, cur = SEARCHES[Math.max(0, k)];
  const typed = Math.round(cur.length * prog(t, QS.marks[Math.max(0, k)] - 0.1, QS.marks[Math.max(0, k)] + 0.5));
  $('q').innerHTML = cur.slice(0, typed) + '<span class="caret" style="opacity:' + (Math.sin(t * 12) > 0 ? 1 : 0) + '"></span>';
  rows.forEach((r, i) => { const a = QS.marks[i] + 0.45, p = back(prog(t, a, a + 0.3));
    r.style.opacity = clamp(p * 2); r.style.transform = 'translateX(' + (1 - Math.min(1, p)) * -60 + 'px)'; });

  // Asking PsycheAI: the line, then the phone with the question; the answer typed in.
  const askOn = t >= ASK.start - 0.05 && t < REP.start;
  const a1 = back(prog(t, ASK.vo - 0.2, ASK.vo + 0.2)), a2 = back(prog(t, ASK.marks[1] - 0.2, ASK.marks[1] + 0.2));
  const capsOut = prog(t, ANS.start - 0.2, ANS.start + 0.1);
  show('ask1', askOn ? clamp(a1 * 2) * (1 - capsOut) : 0, 'scale(' + (0.8 + 0.2 * Math.min(1, a1)) + ')');
  show('ask2', askOn ? clamp(a2 * 2) * (1 - capsOut) : 0, 'scale(' + (0.8 + 0.2 * Math.min(1, a2)) + ')');
  const phIn = back(prog(t, ASK.start + 0.2, ASK.start + 0.6)), phUp = easeIO(prog(t, ANS.start - 0.2, ANS.start + 0.3)), phOut = prog(t, REP.start - 0.3, REP.start + 0.1);
  show('phone', askOn ? clamp(phIn * 2) * (1 - phOut) : 0, 'translateY(' + ((1 - Math.min(1, phIn)) * 300 + 120 - 240 * phUp) + 'px) scale(' + (1 - 0.08 * phOut) + ')');
  const typedW = Math.round(answerWords.length * prog(t, ANS.vo, ANS.end - 0.9));
  $('answer').innerHTML = fixTags(answerWords.slice(0, typedW).join('')) || '<span style="opacity:.5">● ● ●</span>';
  $('source').textContent = typedW >= answerWords.length ? 'From your messages, posts and saves' : '';

  // What the report adds.
  const repOn = t >= REP.start - 0.05 && t < CLOSE.start, repOut = prog(t, REP.end - 0.25, REP.end);
  const mr = back(prog(t, REP.vo - 0.2, REP.vo + 0.2));
  show('more', repOn ? clamp(mr * 2) * (1 - repOut) : 0, 'scale(' + (0.8 + 0.2 * Math.min(1, mr) + pulse * 0.01) + ')');
  cards.forEach((c, i) => { const a = REP.marks[i + 1] - 0.15, p = back(prog(t, a, a + 0.35));
    show(c, repOn ? clamp(p * 2) * (1 - repOut) : 0, 'perspective(1600px) rotateX(' + (1 - Math.min(1, p)) * -70 + 'deg) scale(' + (0.9 + 0.1 * Math.min(1, p)) + ')'); });

  // The close.
  const cl = back(prog(t, CLOSE.vo - 0.2, CLOSE.vo + 0.25));
  show('close', t >= CLOSE.start - 0.05 ? clamp(cl * 2) : 0, 'scale(' + (0.8 + 0.2 * Math.min(1, cl) + pulse * 0.015) + ')');
  const st = back(prog(t, CLOSE.marks[1] - 0.1, CLOSE.marks[1] + 0.3));
  show('site', t >= CLOSE.start ? clamp(st * 2) : 0, 'translateX(-50%) scale(' + (Math.min(1.05, st) + pulse * 0.04 * Math.min(1, st)) + ')');
  const fr = ease(prog(t, CLOSE.voEnd + 0.1, CLOSE.voEnd + 0.5));
  show('free', fr, 'translateY(' + (1 - fr) * 20 + 'px)');
}
window.render = render;
window.ready = Promise.all([document.fonts.ready, ...[...document.images].map(i => i.decode())]);
</script></body></html>
